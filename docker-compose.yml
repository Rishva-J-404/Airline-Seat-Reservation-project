# ============================================================
# docker-compose.yml - FlySmart Airline Reservation & DSA Lab
# Multi-container orchestration: Frontend (Nginx), Backend (Node), Database (Postgres)
# ============================================================

version: '3.8'

services:
  # Relational Database Service
  postgres:
    image: postgres:15-alpine
    container_name: airline_dsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airline_dsa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airline_dsa}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airline_dsa_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-airline_dsa}
      JWT_SECRET: ${JWT_SECRET:-super-secure-jwt-secret-for-airline-dsa-lab-2026}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Single-Page Application Frontend Service (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airline_dsa_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
